# /etc/nginx/sites-available/playtnkr.com
#
# Setup:
#   sudo certbot --nginx -d playtnkr.com -d www.playtnkr.com
#   sudo ln -s /etc/nginx/sites-available/playtnkr.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name playtnkr.com www.playtnkr.com;
    return 301 https://playtnkr.com$request_uri;
}

# Redirect www → apex
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.playtnkr.com;

    ssl_certificate     /etc/letsencrypt/live/playtnkr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playtnkr.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://playtnkr.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name playtnkr.com;

    ssl_certificate     /etc/letsencrypt/live/playtnkr.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/playtnkr.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/tankr/dist;
    index index.html;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"     always;
    add_header Content-Security-Policy
        "default-src 'self';
         script-src  'self' https://static.cloudflareinsights.com;
         connect-src 'self' wss://playtnkr.com https://cloudflareinsights.com;
         style-src   'self' 'unsafe-inline';
         img-src     'self' data:;
         font-src    'self';
         media-src   'self';"
        always;

    # Gzip
    gzip on;
    gzip_types text/plain application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # WebSocket — proxied to the game server
    location /ws {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
        proxy_set_header   Host       $host;
        proxy_read_timeout 3600s;   # keep idle connections alive
        proxy_send_timeout 3600s;
    }

    # REST API — room list, auto-join, create private room
    location /rooms {
        proxy_pass       http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Static assets — long cache, immutable (Vite hashes filenames)
    location /assets/ {
        expires    1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — all other paths serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
